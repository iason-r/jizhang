<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>简易记账</title>
  <style>
    :root {
      --bg:#f6f7fb;
      --card:#fff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#2563eb;
      --primary-soft:#eff6ff;
      --danger:#dc2626;
      --danger-soft:#fee2e2;
      --success:#059669;
      --success-soft:#ecfdf5;
      --warning:#b45309;
      --warning-soft:#fffbeb;
      --shadow:0 8px 24px rgba(0,0,0,.06);
      --radius:16px;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color:transparent;
    }
    button,input { font:inherit; }
    button { cursor:pointer; }
    .hidden { display:none !important; }
    .wrap {
      max-width:1100px;
      margin:0 auto;
      padding:18px 14px calc(36px + env(safe-area-inset-bottom));
    }
    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }
    h1 { margin:0; font-size:27px; }
    .status-wrap {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .status {
      display:inline-flex;
      align-items:center;
      gap:7px;
      font-size:13px;
      color:var(--muted);
      background:#fff;
      border:1px solid var(--line);
      border-radius:999px;
      padding:7px 10px;
    }
    .dot {
      width:8px;
      height:8px;
      border-radius:50%;
      background:#9ca3af;
    }
    .dot.ok { background:var(--success); }
    .dot.busy { background:#f59e0b; }
    .grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }
    .card {
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px;
    }
    .card-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:16px;
    }
