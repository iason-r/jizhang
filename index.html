<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简易记账</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#2563eb;
      --danger:#dc2626;
      --shadow:0 8px 24px rgba(0,0,0,.06);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:28px 18px 50px;
    }
    h1{
      margin:0 0 22px;
      font-size:30px;
    }
    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
    }
    .card h2{
      margin:0 0 16px;
      font-size:22px;
    }
    .row{
      display:grid;
      grid-template-columns:1fr 1fr auto;
      gap:10px;
      align-items:end;
    }
    .row.two{
      grid-template-columns:1fr 1fr;
    }
    label{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin-bottom:6px;
    }
    input{
      width:100%;
      height:42px;
      border:1px solid var(--line);
      border-radius:10px;
      padding:0 12px;
      font-size:15px;
      outline:none;
      background:#fff;
    }
    input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(37,99,235,.10);
    }
    button{
      height:42px;
      border:0;
      border-radius:10px;
      padding:0 16px;
      cursor:pointer;
      font-size:14px;
      font-weight:600;
    }
    .primary{
      background:var(--primary);
      color:#fff;
    }
    .ghost{
      background:#eef2ff;
      color:#3730a3;
    }
    .danger{
      background:#fee2e2;
      color:var(--danger);
      height:34px;
      padding:0 12px;
    }
    .section{
      margin-top:18px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }
    .summary{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px 16px;
      margin-top:12px;
    }
    .summary strong{
      font-size:24px;
    }
    .list{
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      max-height:430px;
      overflow:auto;
    }
    .item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 14px;
      background:#fff;
    }
    .meta{
      min-width:0;
    }
    .name{
      font-weight:700;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .sub{
      margin-top:4px;
      color:var(--muted);
      font-size:13px;
    }
    .amount{
      font-weight:800;
      white-space:nowrap;
      margin-left:auto;
    }
    .empty{
      color:var(--muted);
      text-align:center;
      padding:24px 0;
    }
    .hint{
      color:var(--muted);
      font-size:13px;
      margin-top:8px;
      line-height:1.5;
    }
    .ledger-total{
      margin-top:12px;
      font-size:13px;
      color:var(--muted);
    }
    @media(max-width:800px){
      .grid{grid-template-columns:1fr}
      .row{grid-template-columns:1fr}
      .row.two{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>简易记账</h1>

    <div class="grid">
      <!-- 花费记录 -->
      <section class="card">
        <h2>花费记录</h2>

        <div class="row">
          <div>
            <label for="expenseName">名称</label>
            <input id="expenseName" placeholder="例如：午饭" />
          </div>
          <div>
            <label for="expenseAmount">金额</label>
            <input id="expenseAmount" type="number" step="0.01" min="0" placeholder="例如：25.50" />
          </div>
          <button class="primary" id="addExpenseBtn">添加记录</button>
        </div>

        <div class="hint">添加时会自动记录当天日期。花费记录与账本互不影响。</div>

        <div class="section">
          <div class="row two">
            <div>
              <label for="startDate">开始日期</label>
              <input id="startDate" type="date" />
            </div>
            <div>
              <label for="endDate">结束日期</label>
              <input id="endDate" type="date" />
            </div>
          </div>

          <div class="summary">
            <span>所选日期总金额</span>
            <strong id="expenseTotal">¥0.00</strong>
          </div>

          <div class="list" id="expenseList"></div>
        </div>
      </section>

      <!-- 账本 -->
      <section class="card">
        <h2>账本</h2>

        <div class="row">
          <div>
            <label for="ledgerName">账本名称</label>
            <input id="ledgerName" placeholder="例如：支付宝" />
          </div>
          <div>
            <label for="ledgerBalance">余额</label>
            <input id="ledgerBalance" type="number" step="0.01" placeholder="例如：3200.00" />
          </div>
          <button class="primary" id="addLedgerBtn">添加账本</button>
        </div>

        <div class="hint">账本只记录名称和当前余额，不会和上面的花费记录联动。</div>

        <div class="section">
          <div class="list" id="ledgerList"></div>
          <div class="ledger-total" id="ledgerCount">共 0 个账本</div>
        </div>
      </section>
    </div>
  </div>

<script>
  const EXPENSE_KEY = "simple_bookkeeping_expenses_v1";
  const LEDGER_KEY = "simple_bookkeeping_ledgers_v1";

  let expenses = JSON.parse(localStorage.getItem(EXPENSE_KEY) || "[]");
  let ledgers = JSON.parse(localStorage.getItem(LEDGER_KEY) || "[]");

  const $ = (id) => document.getElementById(id);

  function saveExpenses() {
    localStorage.setItem(EXPENSE_KEY, JSON.stringify(expenses));
  }

  function saveLedgers() {
    localStorage.setItem(LEDGER_KEY, JSON.stringify(ledgers));
  }

  function todayString() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  function money(v) {
    return "¥" + Number(v || 0).toFixed(2);
  }

  function renderExpenses() {
    const list = $("expenseList");
    const start = $("startDate").value;
    const end = $("endDate").value;

    const filtered = expenses
      .filter(e => (!start || e.date >= start) && (!end || e.date <= end))
      .sort((a,b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));

    const total = filtered.reduce((sum, e) => sum + Number(e.amount), 0);
    $("expenseTotal").textContent = money(total);

    if (!filtered.length) {
      list.innerHTML = '<div class="empty">当前日期范围内暂无记录</div>';
      return;
    }

    list.innerHTML = filtered.map(e => `
      <div class="item">
        <div class="meta">
          <div class="name">${escapeHtml(e.name)}</div>
          <div class="sub">${e.date}</div>
        </div>
        <div class="amount">${money(e.amount)}</div>
        <button class="danger" onclick="deleteExpense('${e.id}')">删除</button>
      </div>
    `).join("");
  }

  function renderLedgers() {
    const list = $("ledgerList");
    $("ledgerCount").textContent = `共 ${ledgers.length} 个账本`;

    if (!ledgers.length) {
      list.innerHTML = '<div class="empty">暂无账本</div>';
      return;
    }

    list.innerHTML = ledgers.map(l => `
      <div class="item">
        <div class="meta">
          <div class="name">${escapeHtml(l.name)}</div>
        </div>
        <div class="amount">${money(l.balance)}</div>
        <button class="danger" onclick="deleteLedger('${l.id}')">删除</button>
      </div>
    `).join("");
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  $("addExpenseBtn").addEventListener("click", () => {
    const name = $("expenseName").value.trim();
    const amountText = $("expenseAmount").value.trim();
    const amount = Number(amountText);

    if (!name) {
      alert("请输入花费名称");
      return;
    }
    if (amountText === "" || !Number.isFinite(amount) || amount < 0) {
      alert("请输入正确的金额");
      return;
    }

    expenses.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
      name,
      amount,
      date: todayString(),
      createdAt: new Date().toISOString()
    });

    saveExpenses();
    $("expenseName").value = "";
    $("expenseAmount").value = "";
    $("expenseName").focus();
    renderExpenses();
  });

  $("addLedgerBtn").addEventListener("click", () => {
    const name = $("ledgerName").value.trim();
    const balanceText = $("ledgerBalance").value.trim();
    const balance = Number(balanceText);

    if (!name) {
      alert("请输入账本名称");
      return;
    }
    if (balanceText === "" || !Number.isFinite(balance)) {
      alert("请输入正确的余额");
      return;
    }

    ledgers.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
      name,
      balance
    });

    saveLedgers();
    $("ledgerName").value = "";
    $("ledgerBalance").value = "";
    $("ledgerName").focus();
    renderLedgers();
  });

  window.deleteExpense = function(id) {
    if (!confirm("确定删除这条花费记录吗？")) return;
    expenses = expenses.filter(e => e.id !== id);
    saveExpenses();
    renderExpenses();
  };

  window.deleteLedger = function(id) {
    if (!confirm("确定删除这个账本吗？")) return;
    ledgers = ledgers.filter(l => l.id !== id);
    saveLedgers();
    renderLedgers();
  };

  $("startDate").addEventListener("change", renderExpenses);
  $("endDate").addEventListener("change", renderExpenses);

  $("expenseAmount").addEventListener("keydown", e => {
    if (e.key === "Enter") $("addExpenseBtn").click();
  });
  $("ledgerBalance").addEventListener("keydown", e => {
    if (e.key === "Enter") $("addLedgerBtn").click();
  });

  // 默认日期范围：本月1日至今天
  const now = new Date();
  const firstDay = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-01`;
  $("startDate").value = firstDay;
  $("endDate").value = todayString();

  renderExpenses();
  renderLedgers();
</script>
</body>
</html>
